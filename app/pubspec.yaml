name: wanderer
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  collection: ^1.19.1
  cookie_jar: ^4.0.9
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  disk_space_2: ^1.0.12
  duration: ^4.0.3
  exif: ^3.3.0
  file_picker: ^11.0.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_form_builder: ^10.3.0+2
  flutter_html: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^18.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_rotation_sensor: ^0.2.0
  flutter_svg: ^2.2.4
  flutter_web_auth_2: ^5.0.3
  font_awesome_flutter: ^11.0.0
  form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.0
  go_router: ^17.2.1
  gpx: ^2.3.0
  html: ^0.15.6
  image_picker: ^1.2.2
  intl: any
  json_annotation: ^4.11.0
  latlong2: ^0.9.1
  maplibre: 0.3.5
  meta: ^1.18.0
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pmtiles: ^1.2.0
  receive_sharing_intent: ^1.8.1
  pointer_interceptor: ^0.10.1
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.2
  share_plus: ^12.0.2
  skeletonizer: ^2.1.3
  textfield_tags: ^3.0.1
  timeago: ^3.7.1
  tiptap_flutter:
    path: vendor/tiptap_flutter
  tracelet: ^3.5.0
  url_launcher: ^6.3.2
  xml: ^6.3.0
  cached_network_image: ^3.4.1

dependency_overrides:
  meta: ^1.18.0

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  json_to_arb: ^0.1.14
  objectbox_generator: ^5.3.1
  path_provider_platform_interface: ^2.1.3
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/svgs/
    - assets/map/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans/IBMPlexSans-Bold.ttf
          weight: 700

    - family: Noto Sans Regular
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
