name: Publish dev Release

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump versions
        id: bump_versions
        run: |
          MEILI_VERSION="$(sed -n 's/^ARG MEILI_TARGET_VERSION=//p' search/Dockerfile | head -n1)"

          if [ -z "${MEILI_VERSION}" ]; then
            echo "Could not determine MEILI_TARGET_VERSION from search/Dockerfile" >&2
            exit 1
          fi

          echo "meili_target_version=${MEILI_VERSION}" >> $GITHUB_OUTPUT
          
          LAST_TAG=$(git describe --tags --abbrev=0)
          BASE_VERSION=${LAST_TAG#v}
          FULL_SHA=$(git rev-parse HEAD)
          VERSION="${BASE_VERSION}-dev+${FULL_SHA}"
          cd web && npm version $VERSION --no-git-tag-version && cd ..
          cd docs && npm version $VERSION --no-git-tag-version && cd ..

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        env:
          MEILI_TARGET_VERSION: ${{ steps.bump_versions.outputs.meili_target_version }}
        run: |
          docker buildx build search/ --no-cache --build-arg MEILI_TARGET_VERSION=$MEILI_TARGET_VERSION \
            -t ghcr.io/open-wanderer/wanderer-search:dev --push
          docker buildx build db/ --no-cache -t ghcr.io/open-wanderer/wanderer-db:dev --push
          docker buildx build web/ --no-cache -t ghcr.io/open-wanderer/wanderer-web:dev --push
