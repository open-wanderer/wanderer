name: Web CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - '.github/**'
      - 'web/**'
  pull_request:
    paths:
      - '.github/**'
      - 'web/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - run: make db-build-docker

      - run: make web-build-docker

      - name: Start test stack
        timeout-minutes: 15
        run: |
          sed -e 's/^MEILI_MASTER_KEY=.*/MEILI_MASTER_KEY=web-ci-meili-master-key/' \
              -e 's/^POCKETBASE_ENCRYPTION_KEY=.*/POCKETBASE_ENCRYPTION_KEY=fde406459dc1f6ca6f348e1f44a9a2af/' \
              -e 's/^POCKETBASE_PROXY_SECRET=.*/POCKETBASE_PROXY_SECRET=web-ci-proxy-secret/' \
              .env.example > .env
          docker compose up -d --wait --wait-timeout 840

      - run: make web-install
      - run: make web-playwright-install
      - run: make web-check
      - run: make web-test

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
