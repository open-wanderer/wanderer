name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  # Only run if the PR was merged AND it came from a release branch
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version Output
        id: get_version
        run: |
          # Extract v0.12.0 from release/v0.12.0
          VERSION_TAG=${GITHUB_HEAD_REF#release/}
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          
          # Git Tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $VERSION_TAG
          git push origin $VERSION_TAG

  docker-build:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Images
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          docker buildx build db/ --no-cache -t flomp/wanderer-db:$VERSION -t flomp/wanderer-db:latest --platform=linux/amd64,linux/arm64 --push
          npm --prefix web ci
          npm --prefix web run openapi:generate
          docker buildx build web/ --no-cache -t flomp/wanderer-web:$VERSION -t flomp/wanderer-web:latest --platform=linux/amd64,linux/arm64 --push
          npm --prefix docs ci
          npm --prefix docs run build
          docker buildx build ./docs --no-cache -t flomp/wanderer-docs:$VERSION -t flomp/wanderer-docs:latest --platform=linux/amd64,linux/arm64 --push

  release:
    needs: [publish, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TINYGO_VERSION: '0.41.1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install TinyGo
        run: |
          curl -fsSL "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb" -o /tmp/tinygo.deb
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Build Plugin Release Assets
        run: make plugins-package
      
      # Written to a file and passed via body_path: echoing the notes into
      # $GITHUB_OUTPUT with printf broke on the heredoc delimiter and on `%`.
      - name: Extract release notes
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          # Matches both "# 0.12.0" and "# v0.12.0" headings
          RAW_VER=${VERSION#v}
          awk -v ver="$RAW_VER" 'BEGIN {in_section=0} /^# / {if (in_section) exit; v=$2; sub(/^v/, "", v); if (v == ver) in_section=1} in_section {print}' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No '# $RAW_VER' section found in CHANGELOG.md."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.publish.outputs.version }}
          body_path: release_notes.md
          files: |
            plugin_dist/*.tar.gz
            plugin_dist/SHA256SUMS
          draft: false
          prerelease: false

  sync-dev:
    needs: [publish, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into a sync branch off dev
        id: merge
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          BRANCH="sync/${VERSION}-into-dev"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout -b "$BRANCH" origin/dev
          git merge --no-edit origin/main
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create sync PR
        id: cpr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          HEAD_BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          URL=$(gh pr create \
            --base dev \
            --head "$HEAD_BRANCH" \
            --title "chore: sync ${VERSION} into dev" \
            --body "Automated sync of the ${VERSION} release (version bump + tag) back into dev.")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The plugin SDK (plugins/sdk) is only versioned with a wanderer release: if it
  # changed since its last tag, the release commit also gets the next SDK tag, so
  # every SDK version names the release that understands it. gorelease picks the
  # version from the API diff: patch without API changes, otherwise minor (also
  # for incompatible changes while the SDK is v0).
  plugin-sdk:
    needs: [publish, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: plugins/sdk/go.sum

      - name: Tag the plugin SDK
        id: tag
        run: |
          git fetch --quiet --depth=1 origin 'refs/tags/plugins/sdk/*:refs/tags/plugins/sdk/*'

          # A re-run after the tag was pushed only repeats the release notes step.
          CURRENT=$(git tag -l 'plugins/sdk/v*' --points-at HEAD | head -n1)
          if [ -n "$CURRENT" ]; then
            echo "next=${CURRENT#plugins/sdk/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Changes to tests alone do not need a new SDK version. The glob magic
          # lets **/ also match test files directly in plugins/sdk.
          BASE=$(git tag -l 'plugins/sdk/v*' --sort=-v:refname | head -n1)
          if git diff --quiet "$BASE" HEAD -- plugins/sdk \
              ':(exclude,glob)plugins/sdk/**/*_test.go' \
              ':(exclude,glob)plugins/sdk/**/testdata/**'; then
            echo "Plugin SDK unchanged since $BASE apart from tests, no new SDK version."
            exit 0
          fi

          REPORT=$(make -s plugins-sdk-api) || STATUS=$?
          echo "$REPORT"
          printf '### Plugin SDK compared with `%s`\n\n```\n%s\n```\n' "$BASE" "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          NEXT=$(sed -n 's/^Suggested version: \(v[^ ]*\).*/\1/p' <<< "$REPORT")
          if [ -n "${STATUS:-}" ] || [ -z "$NEXT" ]; then
            echo "::error title=Plugin SDK::gorelease did not suggest a version. Fix the reported problem and tag the SDK on $VERSION by hand."
            exit 1
          fi

          git tag "plugins/sdk/$NEXT"
          git push origin "plugins/sdk/$NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Name the SDK version in the release notes
        if: steps.tag.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.tag.outputs.next }}
        run: |
          gh release view "$VERSION" --json body --jq .body > release_notes.md
          if grep -q '^## Plugin SDK' release_notes.md; then
            exit 0
          fi
          printf '\n## Plugin SDK\n\n- Plugin SDK %s: `go get github.com/open-wanderer/wanderer/plugins/sdk@%s`\n' "$NEXT" "$NEXT" >> release_notes.md
          gh release edit "$VERSION" --notes-file release_notes.md
